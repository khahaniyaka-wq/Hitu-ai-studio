
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitu AI Studio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #10101d;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  max-width: 650px;
  margin: auto;
  background: #1c1c30;
  padding: 22px;
  border-radius: 18px;
}
h1 { text-align: center; color: #9b8cff; }
p { text-align: center; color: #ccc; }
button, input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
}
button {
  background: #7357ed;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: 0.6; }
.modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.modes button { background: #34334c; }
.modes button.active { background: #7357ed; }
label { display: block; margin-top: 12px; color: #ddd; }
#result {
  margin-top: 18px;
  padding: 12px;
  background: #292941;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
video, #result img {
  width: 100%;
  margin-top: 12px;
  border-radius: 10px;
}
</style>
</head>
<body>
<div class="container">

<h1>✨ Hitu AI Studio</h1>
<p>AI Image અને Video Generator</p>

<h3>Mode પસંદ કરો</h3>
<div class="modes">
<button class="active" onclick="setMode(this,'video')">Text to Video</button>
<button onclick="setMode(this,'imageVideo')">Image to Video</button>
<button onclick="setMode(this,'cartoon')">2D Cartoon</button>
<button onclick="setMode(this,'image')">AI Image</button>
</div>

<label>તમારો Prompt લખો</label>
<textarea id="prompt" rows="5"
placeholder="તમારે કેવો ફોટો કે વીડિયો બનાવવો છે?"></textarea>

<div id="imageBox" style="display:none">
<label>Image URL નાખો</label>
<input id="imageUrl" type="url"
placeholder="https://example.com/image.jpg">
</div>

<label>Video Size</label>
<select id="ratio">
<option value="16:9">Landscape 16:9</option>
<option value="9:16">Portrait 9:16</option>
</select>

<label>Quality</label>
<select id="quality">
<option value="standard">Standard</option>
</select>

<button id="generateBtn" onclick="generate()">🚀 Generate</button>
<div id="result" style="display:none"></div>

</div>

<script>
const API = "https://hitu-ai-backend.khahaniyaka.workers.dev";
let selected = "video";

function setMode(btn, mode) {
  selected = mode;
  document.querySelectorAll(".modes button")
    .forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("imageBox").style.display =
    mode === "imageVideo" ? "block" : "none";
}

function show(message) {
  const box = document.getElementById("result");
  box.style.display = "block";
  box.textContent = message;
}

async function generate() {
  const prompt = document.getElementById("prompt").value.trim();
  const imageUrl = document.getElementById("imageUrl").value.trim();
  const btn = document.getElementById("generateBtn");

  if (!prompt) {
    alert("કૃપા કરીને Prompt લખો");
    return;
  }

  if (selected === "imageVideo" && !imageUrl) {
    alert("Image URL નાખો");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Generating...";
  show("AI કામ શરૂ કરી રહ્યું છે...");

  try {
    const mode = selected === "cartoon" ? "video" : selected;
    const finalPrompt = selected === "cartoon"
      ? "2D cartoon animation style: " + prompt
      : prompt;

    const response = await fetch(API + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: mode,
        prompt: finalPrompt,
        image_url: imageUrl
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || JSON.stringify(data));
    }

    const requestId = data.request_id || data.requestId;
    const model = data.model;

    if (!requestId || !model) {
      throw new Error("Backend તરફથી request ID અથવા model મળ્યું નથી.");
    }

    let completed = false;

    for (let i = 0; i < 60; i++) {
      await new Promise(resolve => setTimeout(resolve, 5000));

      const statusResponse = await fetch(
        API + "/status?model=" + encodeURIComponent(model) +
        "&request_id=" + encodeURIComponent(requestId)
      );

      const statusData = await statusResponse.json();

      if (statusData.status === "COMPLETED") {
        completed = true;
        break;
      }

      if (statusData.status === "FAILED") {
        throw new Error(statusData.error || "AI generation નિષ્ફળ ગયું.");
      }

      show("AI બનાવી રહ્યું છે... " + ((i + 1) * 5) + " સેકન્ડ");
    }

    if (!completed) {
      throw new Error("સમય પૂરો થયો. ફરી પ્રયાસ કરો.");
    }

    const resultResponse = await fetch(
      API + "/result?model=" + encodeURIComponent(model) +
      "&request_id=" + encodeURIComponent(requestId)
    );

    const output = await resultResponse.json();

    if (!resultResponse.ok) {
      throw new Error(JSON.stringify(output));
    }

    const videoUrl =
      output.video?.url ||
      output.video_url ||
      output.data?.video?.url;

    const imageResult =
      output.images?.[0]?.url ||
      output.image?.url ||
      output.data?.images?.[0]?.url;

    const box = document.getElementById("result");
    box.innerHTML = "<h3>તમારું પરિણામ તૈયાર છે!</h3>";

    if (videoUrl) {
      const video = document.createElement("video");
      video.src = videoUrl;
      video.controls = true;
      video.playsInline = true;
      box.appendChild(video);
    } else if (imageResult) {
      const img = document.createElement("img");
      img.src = imageResult;
      box.appendChild(img);
    } else {
      show("પરિણામની લિંક મળી નથી: " + JSON.stringify(output));
    }

  } catch (error) {
    show("Error: " + error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 Generate";
  }
}
</script>
</body>
</html>
